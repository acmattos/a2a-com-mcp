[project]
name = "a-ponte"
version = "1.0.0"
description = "A Ponte: A2A agent with an MCP host inside (MCP server + A2A agent, no LLM)"
requires-python = ">=3.12"
dependencies = [
    "mcp==2.3.0",
    "a2a-sdk[http-server]==1.3.0",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
    "httpx==0.28.1",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
